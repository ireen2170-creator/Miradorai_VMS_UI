services:
  ome:
    image: airensoft/ovenmediaengine:latest
    container_name: mirador-ome
    stop_grace_period: 1s
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "9999:9999/udp"
      - "3333:3333"
      - "3334:3334"
      - "8080:8080"
      - "8081:8081"
      - "10000-10009:10000-10009/udp"
    volumes:
      - ./origin_conf:/opt/ovenmediaengine/bin/origin_conf
    networks:
      - vmsnet

  mongo:
    image: mongo:7
    container_name: mirador-mongo
    stop_grace_period: 1s
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vmsnet

  backend:
    build: ./onvif-backend
    container_name: mirador-backend
    stop_grace_period: 1s
    restart: unless-stopped
    ports:
      - "8000:8000"
